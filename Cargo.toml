[package]
name = "grib2pmtiles"
version = "0.1.0"
edition = "2024"
description = "Convert JMA GRIB2 grid products directly to layered PMTiles archives"
repository = "https://github.com/MIERUNE/grib2pmtiles"
license = "MIT OR Apache-2.0"
publish = false

[workspace]
members = ["crates/*"]
resolver = "3"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
flate2 = "1.1.9"
fast-mvt = { version = "0.6.2", default-features = false, features = ["writer"] }
fast_hilbert = "2.1.0"
foldhash = "0.2.0"
gpv-products = { path = "crates/gpv-products" }
pmtiles = { version = "0.23", default-features = false, features = ["write"] }
rayon = "1.12.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tinygrib2 = { git = "https://github.com/ciscorn/tinygrib2.git" }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
png = "0.18.1"

[dev-dependencies]
chrono = "0.4.45"
# Tests decode the tiles they render.
fast-mvt = { version = "0.6.2", default-features = false, features = ["writer", "reader"] }

[profile.release]
lto = "fat"
